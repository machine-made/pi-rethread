# Public repo: CodeRabbit reviews the opening push of non-draft PRs not authored by dependabot[bot] or renovate[bot] (jac decision 0048); later pushes on request (@coderabbitai review).
inheritance: true
reviews:
  auto_review:
    enabled: true
    drafts: false
    ignore_usernames: ["dependabot[bot]", "renovate[bot]"]
